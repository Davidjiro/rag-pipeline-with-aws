name: ci

# Runs the same verification as `npm run verify` (infrastructure checks and the backend lint and tests). It never deploys and needs no AWS credentials, so the
# "AWS validate-template" layer is reported as SKIPPED here and runs on a developer machine.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          npm ci --prefix infra
          pip install cfn-lint -r backend/api/requirements.txt -r backend/requirements-dev.txt
      - name: Verify (format, types, tests, synth with cdk-nag, cfn-lint, backend lint and tests)
        run: bash scripts/verify.sh
