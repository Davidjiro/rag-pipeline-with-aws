name: ci

# Runs the same verification as `npm run verify`: infrastructure checks plus backend and agent lint and tests.
# It never deploys and needs no AWS credentials, so the "AWS validate-template" layer is reported as SKIPPED here.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          npm ci --prefix infra
          pip install cfn-lint -r backend/api/requirements.txt -r backend/requirements-dev.txt
      - name: Create the agent environment (its dependencies are separate from the backend's)
        run: |
          python -m venv /tmp/agent-venv
          /tmp/agent-venv/bin/pip install -r agent/requirements.txt -r agent/requirements-dev.txt
      - name: Verify (format, types, tests, synth with cdk-nag, cfn-lint, backend and agent lint and tests)
        run: AGENT_PYTHON=/tmp/agent-venv/bin/python bash scripts/verify.sh
