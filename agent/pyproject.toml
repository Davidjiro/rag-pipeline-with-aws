# Tooling configuration for the agent: lint, format and tests. Runtime dependencies are in requirements.txt.

[tool.ruff]
line-length = 130
target-version = "py313"
extend-exclude = ["**/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::pydantic.warnings.PydanticDeprecatedSince20", "ignore:Using .httpx. with .starlette.testclient"]
